# z3-sys 0.8.1 собирает Z3 4.12.1 из исходников. В том дереве
# cmake_minimum_required(VERSION 3.4), а CMake 4 (образ windows-2025)
# такую версию больше не принимает и роняет `cargo build` на шаге
# конфигурации. Переменная поднимает нижнюю границу политик до 3.5.
# Исходники солвера и логика агента не меняются. На CMake < 4 переменная
# просто не читается.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
