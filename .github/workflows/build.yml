name: build

# Настоящая проверка Windows-сборки: C++/WinRT, UI Automation и GUI
# существуют только под Windows, поэтому linux-джоб проверяет лишь логику ядра.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Go router
        working-directory: router
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go vet ./...
          go test ./...
          go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o pcagent-router.exe .
      - name: Rust core + C++ native
        working-directory: core
        run: |
          cargo fmt --check
          cargo build --release
          cargo test --release
      - uses: actions/upload-artifact@v4
        with:
          name: pcagent-windows-x64
          path: core/target/release/pcagent.exe
      # Дым-проверка на живой Windows: exe стартует, роутер отвечает,
      # native-слой видит экран, GUI рисуется. Не валит сборку: на раннере
      # нет полноценной интерактивной сессии, поэтому часть проверок экрана
      # может быть недоступна — но отчёт и снимок всё равно сохраняются.
      - name: Smoke на Windows (selfcheck + скриншоты)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Resolve-Path core/target/release/pcagent.exe
          New-Item -ItemType Directory -Force "$env:APPDATA\PCAgent" | Out-Null
          # Согласие проставляем заранее: модальное окно первого запуска
          # в CI нажать некому.
          Set-Content "$env:APPDATA\PCAgent\consent.json" "ci"
          $dir = (New-Item -ItemType Directory -Force ci-evidence).FullName
          # Start-Process -Wait обязателен: exe собран как windows-подсистема,
          # PowerShell такие процессы не ждёт и отчёта бы ещё не было.
          $sc = Start-Process $exe -ArgumentList "--selfcheck","--report","$dir\selfcheck.txt" -Wait -PassThru
          if (Test-Path "$dir\selfcheck.txt") { Get-Content "$dir\selfcheck.txt" }
          $gui = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          Start-Process $exe -ArgumentList "--shot","$dir\gui.png" -Wait
          # Второй кадр — окно с введённой задачей: печатаем текст в поле
          # через SendKeys, чтобы в артефакте было видно не только пустое окно.
          Add-Type -AssemblyName System.Windows.Forms, Microsoft.VisualBasic
          try {
            [Microsoft.VisualBasic.Interaction]::AppActivate($gui.Id)
            Start-Sleep -Milliseconds 500
            [System.Windows.Forms.SendKeys]::SendWait("{TAB}Open notepad and type hello")
            Start-Sleep -Seconds 2
            Start-Process $exe -ArgumentList "--shot","$dir\gui-task.png" -Wait
          } catch { Write-Host "ввод задачи не удался: $_" }
          Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\PCAgent\logs\*.log" $dir -ErrorAction SilentlyContinue
          exit $sc.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcagent-windows-smoke
          path: ci-evidence

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - working-directory: router
        run: go vet ./... && go test ./...
      - working-directory: core
        run: cargo fmt --check && cargo test
