<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jev — кто на самом деле сделал</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;background:#111;color:#eee}
textarea,input,button{width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #444;background:#1b1b1b;color:#eee;font-size:15px}
textarea{min-height:140px}
button{background:#2d6cdf;border:none;font-weight:600;cursor:pointer}
#verdict{margin-top:16px;padding:14px;border-radius:8px;white-space:pre-wrap}
.fabrication{background:#5a1717}.confirmed{background:#174d25}.unproven,.no_claims,.err{background:#3a3a1a}
small{color:#999}
</style>
</head>
<body>
<h2>Проверка авторства</h2>
<small>Вставьте сообщение бота («это сделал Claude…») и приложите файл, о котором речь. Решает реестр шлюза, а не бот.</small>
<textarea id="text" placeholder="Сообщение бота"></textarea>
<input id="agent" placeholder="Какой бот это написал (например grok-1)">
<input id="files" type="file" multiple>
<button id="go">Проверить</button>
<div id="verdict"></div>
<script>
const toB64 = f => new Promise((ok, bad) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = bad;
  r.readAsDataURL(f);
});
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('verdict');
  out.className = ''; out.textContent = 'Проверяю…';
  const attachments = [];
  for (const f of document.getElementById('files').files) attachments.push({name: f.name, base64: await toB64(f)});
  const body = {text: document.getElementById('text').value, attachments};
  const agent = document.getElementById('agent').value.trim();
  if (agent) body.agent = agent;
  try {
    const r = await fetch(location.pathname, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const v = await r.json();
    out.className = v.status || 'err';
    const lines = [v.notice || (v.status === 'no_claims' ? 'В тексте нет утверждений об авторстве.' : (v.reason || v.status))];
    for (const c of (v.checks || [])) lines.push('• ' + (c.artifact ? c.artifact + ': ' : '') + c.text);
    out.textContent = lines.join('\n');
  } catch (e) { out.className = 'err'; out.textContent = 'Ошибка: ' + e; }
};
</script>
</body>
</html>
